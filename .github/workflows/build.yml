name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.6
        cache-disabled: true

    - name: Auto Setup Full Project Structure & Icon
      run: |
        mkdir -p app/src/main/java/com/greentrip/tracker
        mkdir -p app/src/main/res/drawable

        MAIN_PATH=$(find . -name "MainActivity.kt" | head -n 1)
        if [ -n "$MAIN_PATH" ]; then
          cp "$MAIN_PATH" app/src/main/java/com/greentrip/tracker/MainActivity.kt
        fi

        # 1. Tao Icon ung dung Vector Logo Xanh SM
        cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#00897B"
                android:pathData="M54,4 C26.39,4 4,26.39 4,54 C4,81.61 26.39,104 54,104 C81.61,104 104,81.61 104,54 C104,26.39 81.61,4 54,4 Z"/>
            <path
                android:strokeColor="#00E676"
                android:strokeWidth="2.5"
                android:pathData="M54,10 C29.7,10 10,29.7 10,54 C10,78.3 29.7,98 54,98 C78.3,98 98,78.3 98,54 C98,29.7 78.3,10 54,10 Z"/>
            <path
                android:fillColor="#FFD600"
                android:pathData="M58,26 L38,54 L52,54 L46,82 L68,50 L54,50 Z"/>
        </vector>
        EOF

        # 2. Tao gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # 3. Tao settings.gradle.kts (Chi dung google va mavenCentral de tranh loi plugins.gradle.org)
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "GreenTripTracker"
        include(":app")
        EOF

        # 4. Tao build.gradle.kts goc voi classpath truc tiep (Chong loi POM)
        cat << 'EOF' > build.gradle.kts
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath("com.android.tools.build:gradle:8.4.2")
                classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
            }
        }
        EOF

        # 5. Tao app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("kotlin-kapt")
        }

        android {
            namespace = "com.greentrip.tracker"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.greentrip.tracker"
                minSdk = 26
                targetSdk = 34
                versionCode = 4
                versionName = "1.4"
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }

            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.14"
            }
        }

        dependencies {
            implementation(platform("androidx.compose:compose-bom:2024.06.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.activity:activity-compose:1.9.0")
            implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2")

            implementation("com.google.android.gms:play-services-mlkit-text-recognition:19.0.0")

            val roomVersion = "2.6.1"
            implementation("androidx.room:room-runtime:$roomVersion")
            implementation("androidx.room:room-ktx:$roomVersion")
            kapt("androidx.room:room-compiler:$roomVersion")

            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1")
        }
        EOF

        # 6. Tao AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:icon="@drawable/ic_app_icon"
                android:roundIcon="@drawable/ic_app_icon"
                android:label="GreenTrip Tracker"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Build APK with Gradle
      run: gradle :app:assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GreenTrip-Tracker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
