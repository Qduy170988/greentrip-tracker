name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.6
        cache-disabled: true

    - name: Auto Setup Full Project Structure
      run: |
        # 1. Tao cac thu muc chuan
        mkdir -p app/src/main/java/com/greentrip/tracker

        # 2. Tu dong tim MainActivity.kt va chuyen vao dung vi tri
        MAIN_PATH=$(find . -name "MainActivity.kt" | head -n 1)
        if [ -n "$MAIN_PATH" ]; then
          cp "$MAIN_PATH" app/src/main/java/com/greentrip/tracker/MainActivity.kt
        fi

        # 3. Tao settings.gradle.kts goc
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "GreenTripTracker"
        include(":app")
        EOF

        # 4. Tao build.gradle.kts goc
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.4.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
            id("org.jetbrains.kotlin.kapt") version "1.9.24" apply false
        }
        EOF

        # 5. Tao app/build.gradle.kts
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("kotlin-kapt")
        }

        android {
            namespace = "com.greentrip.tracker"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.greentrip.tracker"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = "17"
            }

            buildFeatures {
                compose = true
            }
            composeOptions {
                kotlinCompilerExtensionVersion = "1.5.14"
            }
        }

        dependencies {
            implementation(platform("androidx.compose:compose-bom:2024.06.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.ui:ui-tooling-preview")
            implementation("androidx.activity:activity-compose:1.9.0")
            implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2")

            implementation("com.google.android.gms:play-services-mlkit-text-recognition:19.0.0")

            val roomVersion = "2.6.1"
            implementation("androidx.room:room-runtime:$roomVersion")
            implementation("androidx.room:room-ktx:$roomVersion")
            kapt("androidx.room:room-compiler:$roomVersion")

            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1")
        }
        EOF

        # 6. Tao AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:label="GreenTrip Tracker"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Build APK with Gradle
      run: gradle :app:assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GreenTrip-Tracker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
